# mosquitto.conf
# Place this file in your project root and start Mosquitto with:
#   mosquitto -c mosquitto.conf
#
# This config opens Mosquitto to the full local network so the
# ESP32 (on WiFi) can connect and receive commands from the backend.

# Listen on ALL network interfaces (not just localhost)
# This is required for the ESP32 to connect over WiFi
listener 1883 0.0.0.0

# Allow connections without username/password
# Change this to false and add password_file if you need security
allow_anonymous true

# Keep connection logs visible in the terminal
log_type all
